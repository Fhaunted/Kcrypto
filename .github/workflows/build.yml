name: Build Minecraft Plugin

on:
  push:
    branches: [ "main", "master", "dev" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Récupérer le code source du dépôt
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Installer Java (Java 21 recommandé pour les versions récentes de Purpur/Minecraft)
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

  # 3. Installer Gradle officiellement
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # 4. Lancer la compilation (Gradle classique)
      - name: Build with Gradle
        run: gradle clean build

      # 5. Sauvegarder le fichier .jar généré (Artefact GitHub)
      - name: Upload plugin JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: hyori-plugin-jar
          path: build/libs/*-all.jar  # Ajuste selon ton nom de jar final (ex: *-unshaded.jar ou nom exact)
